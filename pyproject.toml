[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invigilator"
version = "0.1.0"
description = "Administer psychometric instruments to language models and chart the results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
invigilate = "invigilator.cli:main"

[tool.setuptools]
packages = ["invigilator"]
